name: Publish to NPM (Trusted)

on:
  release:
    types: [published]
  # Manual trigger, e.g. to retry a publish after a failed release run.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    environment: npm-publish # Must match the environment configured in the npm Trusted Publisher settings

    permissions:
      contents: read # Required to checkout code
      id-token: write # Required for OIDC/Trusted Publishers

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10; OIDC trusted publishing requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build Library
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
